name: Calendar and skill checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run offline tests
        run: python scripts/verify_project.py --report verification-run.json
      - name: Run lunar-input smoke test
        run: python scripts/chart.py --lunar-date 2014-09-21 --lunar-leap --time 15:16 --utc-offset=+08:00 --gender female
      - name: Run offline dual-chart smoke test
        run: python scripts/chart.py --birth "2014-11-13T15:16:00+08:00" --gender female --longitude 116.36 --clock apparent --ziwei --format markdown

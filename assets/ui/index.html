<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>八字与紫微 · 本地排盘</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#23302f;background:#f3f4ef}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:32px 20px}header{margin-bottom:26px}h1{font-weight:650;font-size:30px;margin:0 0 8px}p{line-height:1.7}.muted{color:#64736e;font-size:14px}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px}.card{background:white;border:1px solid #d9dfd6;border-radius:16px;padding:24px}label{display:block;margin:12px 0;font-size:14px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #c5cec4;width:100%;margin-top:5px}input[type=checkbox]{width:auto}button{cursor:pointer;background:#245849;color:white;border:0}button:disabled{opacity:.55;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:12px;flex-wrap:wrap}.toolbar button{width:auto;background:#edf2eb;color:#245849}.error{color:#a42f20;white-space:pre-wrap}#pillars{font-size:27px;letter-spacing:4px;margin:16px 0}#grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(120px,auto));gap:6px;margin-top:18px}.palace{background:#f6f7f2;border:1px solid #dce2d7;border-radius:8px;padding:10px;font-size:13px;min-width:0}.palace strong{display:block;font-size:15px;margin:4px 0;color:#254e43}.palace.ming{border:2px solid #ba8b3b;background:#fff9e9}.center{grid-area:2/2/4/4;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:#edf2eb;border-radius:10px;white-space:pre-line;font-size:14px;line-height:1.8}.tag{color:#9b5c22}details{margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.65 ui-monospace,monospace}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.card{padding:16px}#grid{grid-template-rows:repeat(4,minmax(110px,auto));gap:3px}.palace{padding:6px;font-size:11px}.palace strong{font-size:13px}}
</style>
<header><h1>八字与紫微 · 本地排盘</h1><div class="muted">记录出生资料，查看历法与流派差异。资料仅在本机处理，不自动保存。</div></header>
<div class="layout"><form id="form" class="card">
<div class="row"><label>公历日期<input id="date" type="date" required min="1950-01-01" max="2050-12-31"></label><label>当地记录时间<input id="time" type="time" step="1" required></label></div>
<label>时区<input id="zone" value="Asia/Shanghai" required placeholder="Asia/Shanghai"></label>
<label>重复时间（通常无需选择）<select id="fold"><option value="">自动检查</option><option value="0">时钟回拨前的第一次</option><option value="1">时钟回拨后的第二次</option></select></label>
<label>性别<select id="gender"><option value="female">女</option><option value="male">男</option></select></label>
<label>时间来源<select id="source"><option value="unknown">尚未核实</option><option value="birth_certificate">出生证明</option><option value="hospital_record">医院记录</option><option value="family_memory">家人回忆</option></select></label>
<label><input id="unknown" type="checkbox" checked> 实际时间误差尚不明确</label>
<label>已确认误差 ±分钟<input id="uncertainty" type="number" min="0" max="120" disabled placeholder="0表示明确按记录时刻计算"></label>
<label>出生地点<input id="place" placeholder="区县或医院；不填写姓名"></label>
<div class="row"><label>东经（西经填负）<input id="longitude" type="number" min="-180" max="180" step="any" placeholder="116.36"></label><label>经度来源<input id="coordinate-source" placeholder="医院坐标／县城近似"></label></div>
<label>排盘用钟<select id="clock"><option value="standard">标准时间（UTC+8口径）</option><option value="mean">平太阳时</option><option value="apparent">真太阳时（近似模型）</option></select></label>
<label>八字换日<select id="day-rule"><option value="early-late">晚子时日柱当日、时干次日</option><option value="midnight">午夜换日</option><option value="23">23点换日</option></select></label>
<label><input id="ziwei" type="checkbox" checked> 同时排紫微斗数</label>
<label>紫微闰月<select id="leap"><option value="all">四种规则并列</option><option value="split">闰月分半</option><option value="prev-month">归前月</option><option value="next-month">归后月</option><option value="origin-month">保留闰月</option></select></label>
<label>紫微晚子时<select id="zi-day"><option value="next-day">23点归次日</option><option value="current-day">23点仍归当日</option></select></label>
<label>生年四化<select id="sihua"><option value="iztro">现代引擎表（壬年左辅化科）</option><option value="quanshu">全书所列（壬年天府化科）</option></select></label>
<button id="submit">生成排盘</button><p id="error" class="error" role="alert"></p>
</form><section class="card"><div id="empty"><h2>先填出生资料</h2><p class="muted">记录时间与真实误差分开填写。不同闰月规则可能产生不同命盘；这些差异会分别展示。</p></div><div id="result" class="hidden">
<h2>排盘结果</h2><p id="summary" class="muted"></p><div id="pillars"></div><p id="certainty"></p>
<div class="toolbar"><button type="button" id="download-json">下载完整JSON</button><button type="button" id="download-md">下载中文报告</button><button type="button" id="download-record">下载出生记录</button></div>
<div id="zi-controls"><label>闰月规则<select id="variant"></select></label><label>时间候选<select id="candidate"></select></label></div>
<div id="grid"></div><p id="check" class="muted"></p>
<details><summary>查看完整报告与计算限制</summary><pre id="report"></pre></details>
</div></section></div>
<script>
const $=id=>document.getElementById(id);let current=null,record=null;
$('unknown').onchange=()=>{$('uncertainty').disabled=$('unknown').checked;$('uncertainty').required=!$('unknown').checked};
const download=(name,value,type)=>{const url=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
const branches='子丑寅卯辰巳午未申酉戌亥';const positions={5:[1,1],6:[1,2],7:[1,3],8:[1,4],4:[2,1],9:[2,4],3:[3,1],10:[3,4],2:[4,1],1:[4,2],0:[4,3],11:[4,4]};
function candidates(){const v=current.result.ziwei.variants[+$('variant').value];$('candidate').replaceChildren(...v.candidates.map((c,i)=>new Option(c.example_selected_wall_clock,i)));draw()}
function draw(){const z=current.result.ziwei,v=z.variants[+$('variant').value],c=v.candidates[+$('candidate').value];const chart=c.chart;$('grid').replaceChildren();
for(const p of chart.palaces){const cell=document.createElement('div');cell.className='palace'+(p.isMingGong?' ming':'');const [r,col]=positions[p.branch];cell.style.gridRow=r;cell.style.gridColumn=col;const name=document.createElement('div');name.textContent=p.name+' · '+branches[p.branch]+(p.isShenGong?' · 身宫':'');const stars=document.createElement('strong');stars.textContent=p.stars.filter(s=>s.type==='major').map(s=>s.name).join('、')||'空宫';const si=document.createElement('div');si.className='tag';si.textContent=p.stars.filter(s=>s.siHua).map(s=>s.name+'化'+s.siHua).join('、');const age=document.createElement('div');age.textContent=p.daXianAge?'大限 '+p.daXianAge.join('—')+'岁':'';cell.append(name,stars,si,age);$('grid').append(cell)}
const center=document.createElement('div');center.className='center';center.textContent=chart.wuxingJuName+'\n'+v.label+'\n命主 '+chart.mingZhu+' · 身主 '+chart.shenZhu+'\n四化 '+z.conventions.sihua_profile;$('grid').append(center);$('check').textContent=c.independent_check.matches?'所列独立结构公式复核一致。检查范围与限制见完整报告。':'独立公式存在差异，需复核；详见JSON。'}
$('variant').onchange=candidates;$('candidate').onchange=draw;
$('download-json').onclick=()=>download('chart.json',JSON.stringify(current.result,null,2),'application/json');$('download-md').onclick=()=>download('chart.md',current.markdown,'text/markdown');$('download-record').onclick=()=>download('birth-record.json',JSON.stringify(record,null,2),'application/json');
$('form').onsubmit=async event=>{event.preventDefault();$('error').textContent='';$('submit').disabled=true;
try{record={schema_version:1,birth:$('date').value+'T'+$('time').value,timezone:$('zone').value,gender:$('gender').value,time_source:$('source').value,uncertainty_minutes:$('unknown').checked?null:Number($('uncertainty').value),place:$('place').value,longitude_source:$('coordinate-source').value||'unspecified',clock:$('clock').value,day_rule:$('day-rule').value};if($('fold').value!=='')record.fold=Number($('fold').value);if($('longitude').value!=='')record.longitude=Number($('longitude').value);if($('ziwei').checked){record.ziwei_leap=$('leap').value;record.ziwei_day_rule=$('zi-day').value;record.sihua_profile=$('sihua').value}
const response=await fetch('/api/chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record,ziwei:$('ziwei').checked})});const data=await response.json();if(!response.ok)throw Error(data.error||'排盘失败');current=data;const b=data.result;$('empty').classList.add('hidden');$('result').classList.remove('hidden');$('summary').textContent=b.central.civil_time+' · '+b.central.lunar_date+' · 所选钟 '+b.central.selected_wall_clock;$('pillars').textContent=b.central.pillars.join('　');$('certainty').textContent=b.conventions.uncertainty_minutes===null?'时间误差未知，当前结果暂定。':b.pillars_stable_in_scanned_range?'给定时间范围内四柱相同。':'给定时间范围内存在不同四柱，请查看报告。';$('report').textContent=data.markdown;$('zi-controls').classList.toggle('hidden',!b.ziwei);$('grid').classList.toggle('hidden',!b.ziwei);$('check').textContent='';if(b.ziwei){$('variant').replaceChildren(...b.ziwei.variants.map((v,i)=>new Option(v.label,i)));candidates()}}
catch(error){$('error').textContent=error.message}finally{$('submit').disabled=false}};
</script></html>
